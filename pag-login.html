<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/EscudoBangu.png" type="image/x-icon">
    <link rel="stylesheet" href="Styles/style-login.css">
    <title>Bangu Store</title>
</head>
<body class="login">
    <header>
        <div class="navbar">
          <img src="img/Bangu_escudo2.png" alt="Bangu Atlético Clube" width="80" height="auto">
        </div>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li> <!-- Link para a página inicial -->
            <li><a href="produtos.html">Produtos</a></li> <!-- Link para a página de produtos -->
            <li><a href="sobre.html">Sobre</a></li> <!-- Link para a página sobre -->
            <li><a href="resultados.html">Resultados</a></li>
          </ul>
        </nav>
        <div class="user-options">
          <a href="pag-login.html"><i class="fas fa-user"></i></a>
            
              <button id="theme-toggle">🌙</button>
        </div>
      </header>  
    <!--Tela de Login-->
    <div class="main-login">
        <div class="left-login">
            <div class="logo">
                <img src="img/Bangu_escudo2.png" width="100" height="00" alt="EscudoBangu">

            </div>
            <h1>Bangu Store <br>A moda do Gigante!</h1>
        </div>
        <div class="right-login">
            <div class="card-login">
                <h1>LOGIN</h1>
                <!-- Container para mensagens de feedback -->
                <div id="feedback-message" class="feedback-message"></div>
                <form id="login-form" method="POST" action="php/login.php">
                  <div class="textfield">
                      <label for="usuario">Usuário:</label>
                      <input type="text" id="usuario" name="login" required>
                  </div>
                  <div class="textfield">
                      <label for="senha">Senha:</label>
                      <input type="password" id="senha" name="senha" required>
                  </div>
                  <div class="textfield">
                      <label for="cpf">Verifique com seu CPF:</label>
                      <input type="text" id="cpf" name="cpf" placeholder="Ex: 000.000.000-00" required>
                  </div>
                  <div class="botoes">
                      <button type="submit" id="enviar" class="btn-enviar">Enviar</button>
                      <a href="pag-cadastro.html">
                          <button type="button" id="cadastro" class="btn-cadastro">Cadastrar Novo Usuário</button>
                      </a>
                  </div>
                </form>
             </div>
         </div> 
    </div>
    <script src="JavaScript/script-login.js"></script>
    <script src="JavaScript/script.js"></script>
</body>
</html>
