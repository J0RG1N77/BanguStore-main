<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Link para o arquivo de estilo CSS específico para a página de cadastro -->
    <link rel="stylesheet" href="Styles/style-cadastro.css">
    <!-- Título da página que aparecerá na aba do navegador -->
    <title>Bangu Store</title>
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<body>

<header>
    <div class="navbar">
        <!-- Logo da Bangu Atlético Clube -->
        <img src="img/Bangu_escudo2.png" alt="Bangu Atlético Clube" width="80" height="auto">
    </div>
    <nav>
        <ul>
            <!-- Links de navegação para diferentes páginas do site -->
            <li><a href="index.html">Home</a></li> <!-- Link para a página inicial -->
            <li><a href="produtos.html">Produtos</a></li> <!-- Link para a página de produtos -->
            <li><a href="sobre.html">Sobre</a></li> <!-- Link para a página sobre -->
            <li><a href="resultados.html">Resultados</a></li>
        </ul>
    </nav>
    
    <div class="user-options">
      <a href="pag-login.html"><i class="fas fa-user"></i></a>
      <button id="theme-toggle">🌙</button>
    </div>
</header>

<!-- Container para exibir mensagens de feedback para o usuário -->
<div id="feedback-message" class="feedback-message"></div>

<!-- Espaçador para ajudar no layout -->
<div class="spacer">

    <!-- Início do formulário de cadastro -->
    <main class="main-cadastro">
        <div class="outer-container">
            <h1>CADASTRO</h1> <!-- Título da seção de cadastro -->
            
            <div class="form-container">
                <!-- Formulário de cadastro -->
                <form id="form-cadastro" method="POST" action="php/register.php">
                    <div class="textfield">
                        <!-- Campo para o nome completo -->
                        <label for="nome-completo">Nome Completo:</label>
                        <input type="text" id="nome-completo" name="nome_completo" placeholder="Ex: Adyson Oliveira" required>
                    
                        <!-- Campo para a data de nascimento -->
                        <label for="data-nascimento">Data de nascimento:</label>
                        <input type="date" id="data-nascimento" name="data_nascimento" required>

                        <!-- Campo para o e-mail -->
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="Ex: usuario@exemplo.com" required>

                        <!-- Campo para selecionar o sexo -->
                        <label for="sexo">Sexo:</label>
                        <select name="sexo" id="sexo" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="NI">Não Informar</option>
                        </select>
                        
                        <!-- Campo para o CPF -->
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" placeholder="Ex: 000.000.000-00" required maxlength="14">
                        
                        <!-- Campo para o celular -->
                        <label for="celular">Celular:</label>
                        <input type="text" id="celular" name="celular" placeholder="Ex: (21) 99999-9999" required>
                        
                        <!-- Campo para o endereço completo -->
                        <label for="endereco">Endereço Completo:</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Ex: Rua ...,123" required>
                        
                        <!-- Campo para o login do usuário -->
                        <label for="login">Login:</label>
                        <input type="text" id="login" name="login" placeholder="Ex: Jorge" required maxlength="20">
                        
                        <!-- Campo para a senha do usuário -->
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" placeholder="Ex: 12345678" required maxlength="20">
                        
                        <!-- Campo para confirmar a senha -->
                        <label for="confirmar-senha">Confirmar Senha:</label>
                        <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Ex: 12345678" required maxlength="20">
                        
                    </div>
                    <div class="botoes">
                        <!-- Botão para enviar o formulário de cadastro -->
                        <button type="submit" class="btn-cadastro">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
</div>


<!-- Scripts para adicionar funcionalidades JavaScript -->
<script src="JavaScript/script-cadastro.js"></script>
<script src="JavaScript/script.js"></script>
<script>
// Máscara CPF
function maskCPF(value) {
  return value
    .replace(/\D/g, '')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
}
// Máscara Celular (21) 99999-9999
function maskCelular(value) {
  return value
    .replace(/\D/g, '')
    .replace(/(\d{2})(\d)/, '($1) $2')
    .replace(/(\d{5})(\d)/, '$1-$2')
    .replace(/(-\d{4})\d+?$/, '$1');
}

document.addEventListener('DOMContentLoaded', function() {
  const cpf = document.getElementById('cpf');
  const celular = document.getElementById('celular');
  if (cpf) {
    cpf.addEventListener('input', function(e) {
      this.value = maskCPF(this.value);
    });
  }
  if (celular) {
    celular.addEventListener('input', function(e) {
      this.value = maskCelular(this.value);
    });
  }
});

// Mostrar mensagens vindas do servidor (error / success) na área #feedback-message
document.addEventListener('DOMContentLoaded', function() {
  const feedback = document.getElementById('feedback-message');
  if (!feedback) return;
  const params = new URLSearchParams(window.location.search);
  if (params.has('error')) {
    feedback.textContent = decodeURIComponent(params.get('error'));
    feedback.className = 'feedback-message error';
    feedback.style.display = 'block';
    // remover query string para evitar reaparecer ao recarregar
    history.replaceState(null, '', window.location.pathname);
  } else if (params.has('success')) {
    feedback.textContent = decodeURIComponent(params.get('success'));
    feedback.className = 'feedback-message success';
    feedback.style.display = 'block';
    history.replaceState(null, '', window.location.pathname);
  }
});
</script>

</body>
</html>
